name: .NET CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore API
      run: dotnet restore ./RaceDayAPI/RaceDayAPI.csproj

    - name: Restore MVC
      run: dotnet restore ./RaceDayMVC/RaceDayMVC.csproj

    - name: Restore Tests
      run: dotnet restore ./RaceDayAPI/RaceDayAPI.Tests/RaceDayAPI.Tests.csproj

    - name: Build API
      run: dotnet build ./RaceDayAPI/RaceDayAPI.csproj --configuration Release --no-restore

    - name: Build MVC
      run: dotnet build ./RaceDayMVC/RaceDayMVC.csproj --configuration Release --no-restore

    - name: Build Tests
      run: dotnet build ./RaceDayAPI/RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release --no-restore

    - name: Run Tests
      run: dotnet test ./RaceDayAPI/RaceDayAPI.Tests/RaceDayAPI.Tests.csproj --configuration Release --no-build